services:
  php2shell:
    build: .
    image: vulnforge/php2shell:latest
    container_name: vulnforge-php2shell
    hostname: php2shell
    # n'écoute QUE sur le loopback de ton Mac — jamais exposé au réseau
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - vulnforge-net

networks:
  vulnforge-net:
    external: true   # créé/géré par le CLI vulnforge
